<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test de conexión Criollo</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 20px; line-height: 1.6; max-width: 700px; }
    .resultado { margin: 10px 0 24px; padding: 16px; border-radius: 8px; background: #f0f0f0; white-space: pre-wrap; font-family: monospace; font-size: 13px; }
    .ok { background: #e8f5e9; }
    .err { background: #fdecea; }
    button { padding: 10px 18px; font-size: 14px; cursor: pointer; margin-bottom: 8px; }
    h3 { margin-top: 24px; }
  </style>
</head>
<body>
  <h2>Test de conexión — 3 métodos</h2>
  <p><strong>Importante:</strong> sube este archivo a GitHub y ábrelo desde la URL https:// (NO como archivo local).</p>

  <button onclick="probarTodo()">🔄 Probar los 3 métodos</button>

  <h3>Método 1: JSONP (solo callback, sin onerror)</h3>
  <div class="resultado" id="r1">Sin probar</div>

  <h3>Método 2: fetch normal</h3>
  <div class="resultado" id="r2">Sin probar</div>

  <h3>Método 3: fetch con text/plain</h3>
  <div class="resultado" id="r3">Sin probar</div>

  <script>
    const URL = 'https://script.google.com/macros/s/AKfycbyHmIPQOLpxlOR5ZUWQ1XbowCLLGRTM_YA7idqNWlVP7CEtbRZCzaJebfbV282qqEPyxg/exec';

    function probarTodo() { metodo1(); metodo2(); metodo3(); }

    function metodo1() {
      const div = document.getElementById('r1');
      div.className = 'resultado'; div.textContent = 'Probando...';
      const cb = 'cb1_' + Date.now();
      let listo = false;
      const to = setTimeout(() => {
        if (listo) return; listo = true;
        div.className = 'resultado err';
        div.textContent = '❌ Timeout (10s) — el callback nunca se ejecutó.';
        cleanup();
      }, 10000);
      window[cb] = (data) => {
        if (listo) return; listo = true;
        clearTimeout(to);
        div.className = 'resultado ok';
        div.textContent = '✅ FUNCIONÓ!\n' + JSON.stringify(data);
        cleanup();
      };
      const s = document.createElement('script');
      s.src = URL + '?action=list&callback=' + cb + '&t=' + Date.now();
      function cleanup() { delete window[cb]; if (s.parentNode) s.remove(); }
      document.body.appendChild(s);
    }

    async function metodo2() {
      const div = document.getElementById('r2');
      div.className = 'resultado'; div.textContent = 'Probando...';
      try {
        const res = await fetch(URL + '?action=list&t=' + Date.now());
        const data = JSON.parse(await res.text());
        div.className = 'resultado ok';
        div.textContent = '✅ FUNCIONÓ!\n' + JSON.stringify(data);
      } catch (e) {
        div.className = 'resultado err';
        div.textContent = '❌ ' + e.toString();
      }
    }

    async function metodo3() {
      const div = document.getElementById('r3');
      div.className = 'resultado'; div.textContent = 'Probando...';
      try {
        const res = await fetch(URL + '?action=list&t=' + Date.now(), {
          method: 'GET',
          headers: { 'Content-Type': 'text/plain' },
          redirect: 'follow'
        });
        const data = JSON.parse(await res.text());
        div.className = 'resultado ok';
        div.textContent = '✅ FUNCIONÓ!\n' + JSON.stringify(data);
      } catch (e) {
        div.className = 'resultado err';
        div.textContent = '❌ ' + e.toString();
      }
    }
  </script>
</body>
</html>
